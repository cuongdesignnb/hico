services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hico}
      POSTGRES_USER: ${POSTGRES_USER:-hico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - hico-postgres-data:/var/lib/postgresql/data
      - ./hico_backup_20260728.dump:/backups/hico_backup_20260728.dump:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  mailpit:
    image: axllent/mailpit:v1.22.3
    ports:
      - "8025:8025"
    restart: "no"

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "scripts/migrateDatabase.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hico}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-hico}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hico}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-hico}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-hico}
      DB_USER: ${POSTGRES_USER:-hico}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WORLDMOVE_MERCHANT_ID: ${WORLDMOVE_MERCHANT_ID:?Set WORLDMOVE_MERCHANT_ID in .env}
      WORLDMOVE_DEPT_ID: ${WORLDMOVE_DEPT_ID:?Set WORLDMOVE_DEPT_ID in .env}
      WORLDMOVE_TOKEN: ${WORLDMOVE_TOKEN:?Set WORLDMOVE_TOKEN in .env}
      WORLDMOVE_API_URL: ${WORLDMOVE_API_URL:-http://localhost:4000}
      CATALOG_READ_SOURCE: ${CATALOG_READ_SOURCE:-canonical}
      CATALOG_CANONICAL_FALLBACK: ${CATALOG_CANONICAL_FALLBACK:-false}
      CATALOG_STARTUP_VALIDATION: ${CATALOG_STARTUP_VALIDATION:-true}
      CATALOG_HEALTH_CACHE_TTL_MS: ${CATALOG_HEALTH_CACHE_TTL_MS:-30000}
      CATALOG_REQUIRE_HEALTHY_ON_WRITE: ${CATALOG_REQUIRE_HEALTHY_ON_WRITE:-true}
      CHECKOUT_ENGINE: ${CHECKOUT_ENGINE:-canonical}
      CHECKOUT_STARTUP_VALIDATION: ${CHECKOUT_STARTUP_VALIDATION:-true}
      CHECKOUT_HEALTH_CACHE_TTL_MS: ${CHECKOUT_HEALTH_CACHE_TTL_MS:-30000}
      CHECKOUT_BODY_LIMIT_MB: ${CHECKOUT_BODY_LIMIT_MB:-10}
      WEBHOOK_BODY_LIMIT_KB: ${WEBHOOK_BODY_LIMIT_KB:-256}
      CHECKOUT_RATE_LIMIT_PER_MINUTE: ${CHECKOUT_RATE_LIMIT_PER_MINUTE:-120}
      WORLDMOVE_WEBHOOK_SECRET: ${WORLDMOVE_WEBHOOK_SECRET:-}
      WORLDMOVE_WEBHOOK_TOLERANCE_SECONDS: ${WORLDMOVE_WEBHOOK_TOLERANCE_SECONDS:-300}
      PROVIDER_REQUEST_TIMEOUT_MS: ${PROVIDER_REQUEST_TIMEOUT_MS:-15000}
      CHECKOUT_IDEMPOTENCY_TTL_MS: ${CHECKOUT_IDEMPOTENCY_TTL_MS:-86400000}
      WEBHOOK_REPLAY_TTL_MS: ${WEBHOOK_REPLAY_TTL_MS:-86400000}
      HICO_WEBHOOK_URL: ${HICO_WEBHOOK_URL:-http://localhost:5000/api/webhooks/worldmove/events}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      SEO_ENV: ${SEO_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CSRF_SECRET: ${CSRF_SECRET:-}
      SESSION_STORE_DRIVER: ${SESSION_STORE_DRIVER:-postgres}
      AUTH_RUN_MIGRATIONS_ON_START: ${AUTH_RUN_MIGRATIONS_ON_START:-false}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-30}
      AUTH_ABSOLUTE_TTL_MINUTES: ${AUTH_ABSOLUTE_TTL_MINUTES:-480}
      AUTH_MAX_FAILED_LOGINS: ${AUTH_MAX_FAILED_LOGINS:-5}
      AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_LOGIN_WINDOW_MS: ${RATE_LIMIT_LOGIN_WINDOW_MS:-900000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_ADMIN_WRITE_WINDOW_MS: ${RATE_LIMIT_ADMIN_WRITE_WINDOW_MS:-60000}
      RATE_LIMIT_ADMIN_WRITE_MAX: ${RATE_LIMIT_ADMIN_WRITE_MAX:-120}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SESSION_CLEANUP_INTERVAL_MS: ${SESSION_CLEANUP_INTERVAL_MS:-3600000}
      SESSION_CLEANUP_BATCH_SIZE: ${SESSION_CLEANUP_BATCH_SIZE:-500}
      SESSION_REVOKED_RETENTION_HOURS: ${SESSION_REVOKED_RETENTION_HOURS:-720}
      CUSTOMER_ACCOUNT_MODE: ${CUSTOMER_ACCOUNT_MODE:-demo}
      CUSTOMER_SESSION_SECRET: ${CUSTOMER_SESSION_SECRET:-}
      CUSTOMER_CSRF_SECRET: ${CUSTOMER_CSRF_SECRET:-}
      CUSTOMER_TOKEN_SECRET: ${CUSTOMER_TOKEN_SECRET:-}
      CUSTOMER_AUTH_SESSION_TTL_MINUTES: ${CUSTOMER_AUTH_SESSION_TTL_MINUTES:-30}
      CUSTOMER_AUTH_ABSOLUTE_TTL_MINUTES: ${CUSTOMER_AUTH_ABSOLUTE_TTL_MINUTES:-480}
      CUSTOMER_AUTH_MAX_FAILED_LOGINS: ${CUSTOMER_AUTH_MAX_FAILED_LOGINS:-5}
      CUSTOMER_AUTH_LOCK_MINUTES: ${CUSTOMER_AUTH_LOCK_MINUTES:-15}
      CUSTOMER_EMAIL_VERIFICATION_TTL_MINUTES: ${CUSTOMER_EMAIL_VERIFICATION_TTL_MINUTES:-60}
      CUSTOMER_PASSWORD_RESET_TTL_MINUTES: ${CUSTOMER_PASSWORD_RESET_TTL_MINUTES:-30}
      CUSTOMER_RATE_LIMIT_WINDOW_MS: ${CUSTOMER_RATE_LIMIT_WINDOW_MS:-900000}
      CUSTOMER_RATE_LIMIT_REGISTER_MAX: ${CUSTOMER_RATE_LIMIT_REGISTER_MAX:-5}
      CUSTOMER_RATE_LIMIT_LOGIN_MAX: ${CUSTOMER_RATE_LIMIT_LOGIN_MAX:-10}
      CUSTOMER_RATE_LIMIT_PASSWORD_RESET_MAX: ${CUSTOMER_RATE_LIMIT_PASSWORD_RESET_MAX:-5}
      CUSTOMER_RATE_LIMIT_VERIFICATION_MAX: ${CUSTOMER_RATE_LIMIT_VERIFICATION_MAX:-5}
      DEPENDENCY_GATE_REPORT_PATH: ${DEPENDENCY_GATE_REPORT_PATH:-}
      BACKUP_VERIFICATION_PATH: ${BACKUP_VERIFICATION_PATH:-}
      SECRET_ROTATION_METADATA_PATH: ${SECRET_ROTATION_METADATA_PATH:-}
      CHECKOUT_LAUNCH_REQUIRED: ${CHECKOUT_LAUNCH_REQUIRED:-true}
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: always

  backend-secondary:
    profiles: ["qa"]
    extends:
      service: backend
    ports: !reset
      - "5001:5000"

volumes:
  hico-postgres-data:
